<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}OUTA - Visual Page Builder{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;700;900&family=Source+Code+Pro:wght@400;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    {% if chart_js %}
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.2/dist/chart.umd.min.js"></script>
    {% endif %}
    <style>
        body {
            font-family: 'Outfit', sans-serif;
            background-color: #0a0a1a;
            color: #e0e0e0;
        }
        .content-card {
            background: rgba(26, 26, 78, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
        }
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #111122; }
        ::-webkit-scrollbar-thumb { background: #4b5563; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #dc2626; }
        {% block extra_css %}{% endblock %}
    </style>
</head>
<body class="antialiased">
    {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
            <div id="flash-messages" class="fixed top-4 right-4 z-50">
                {% for category, message in messages %}
                    <div class="flash-message mb-2 p-4 rounded-lg shadow-lg {% if category == 'error' %}bg-red-600{% elif category == 'success' %}bg-green-600{% else %}bg-blue-600{% endif %} text-white">
                        {{ message }}
                        <button onclick="this.parentElement.remove()" class="float-right ml-4 text-white hover:text-gray-200">&times;</button>
                    </div>
                {% endfor %}
            </div>
            <script>
                // Auto-hide flash messages after 5 seconds
                setTimeout(() => {
                    const flashMessages = document.getElementById('flash-messages');
                    if (flashMessages) {
                        flashMessages.style.display = 'none';
                    }
                }, 5000);
            </script>
        {% endif %}
    {% endwith %}

    {% block content %}{% endblock %}

    <script>
        // Initialize Lucide icons
        lucide.createIcons();
        {% block extra_js %}{% endblock %}
    </script>
</body>
</html>
